name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.6.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Build pre-compiled libraries for all supported platforms
  # ===========================================================================
  build-libs:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            # Use macos-14 to avoid queue issues with macos-13 (being deprecated)
            # MACOSX_DEPLOYMENT_TARGET=13.0 ensures compatibility with macOS 13+
            runner: macos-14
            platform: darwin_arm64
            lib_name: libzvec_c_api.dylib
            artifact_name: zvec-libs-darwin-arm64
            env:
              MACOSX_DEPLOYMENT_TARGET: '13.0'
          - name: darwin-x64
            # Intel runner, mirroring upstream _build_macos_x64_sdk.yml.
            # MACOSX_DEPLOYMENT_TARGET=11.0 matches the upstream osx-amd64 SDK
            # and keeps the older Intel install base covered.
            runner: macos-15-intel
            platform: darwin_amd64
            lib_name: libzvec_c_api.dylib
            artifact_name: zvec-libs-darwin-x64
            osx_arch: x86_64
            env:
              MACOSX_DEPLOYMENT_TARGET: '11.0'
          # - name: linux-x64
          #   runner: ubuntu-24.04
          #   platform: linux_amd64
          #   lib_name: libzvec_c_api.so
          #   artifact_name: zvec-libs-linux-x64
          - name: linux-x64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.03.01-1
            platform: linux_amd64
            lib_name: libzvec_c_api.so
            artifact_name: zvec-libs-linux-x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            # manylinux_2_28 (glibc 2.28) to match upstream; building directly
            # on the Ubuntu 24.04 runner would require glibc 2.39.
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.03.01-1
            platform: linux_arm64
            lib_name: libzvec_c_api.so
            artifact_name: zvec-libs-linux-arm64
          - name: linux-musl-x64
            runner: ubuntu-24.04
            container: quay.io/pypa/musllinux_1_2_x86_64:2026.03.01-1
            platform: linux_amd64
            lib_name: libzvec_c_api.so
            artifact_name: zvec-libs-linux-musl-x64
            musl: true
          # GitHub runners cannot execute JavaScript actions inside Alpine
          # containers on arm64, so this job keeps the actions on the host
          # and runs the build inside a container via docker exec — the same
          # approach as build-musl-arm64 in upstream _build_prebuilt.yml.
          - name: linux-musl-arm64
            runner: ubuntu-24.04-arm
            platform: linux_arm64
            lib_name: libzvec_c_api.so
            artifact_name: zvec-libs-linux-musl-arm64
            musl: true
            docker_build: quay.io/pypa/musllinux_1_2_aarch64:2026.03.01-1
          - name: windows-x64
            runner: windows-2025
            platform: windows_amd64
            lib_name: zvec_c_api.dll
            artifact_name: zvec-libs-windows-x64
            msvc_arch: x64
          - name: windows-arm64
            # Native Windows ARM64 runner, mirroring upstream _build_prebuilt.yml.
            runner: windows-11-arm
            platform: windows_arm64
            lib_name: zvec_c_api.dll
            artifact_name: zvec-libs-windows-arm64
            msvc_arch: arm64
            # lukka/get-cmake ships no Windows ARM64 binaries, so this job uses
            # the pip-provided Ninja toolchain instead of the VS generator.
            win_cmake_args: '-G Ninja'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # For workflow_dispatch, checkout the tag the user typed in;
          # for push of a tag, checkout that tag directly.
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      # musllinux containers may lack bash/git, which later steps need.
      - name: Ensure bash & git (musl container)
        if: matrix.musl && !matrix.docker_build
        run: |
          command -v bash || apk add --no-cache bash
          command -v git || apk add --no-cache git
        shell: sh

      # Ensure zvec submodule has full history and tags so that
      # `git describe --tags` in CMake can resolve the correct version.
      - name: Fetch tags for zvec submodule
        run: |
          cd zvec
          git fetch --tags --unshallow 2>/dev/null || git fetch --tags
          echo "=== zvec describe ==="
          git describe --tags || true
        shell: bash
        if: runner.os != 'Windows'

      - name: Fetch tags for zvec submodule (Windows)
        if: runner.os == 'Windows'
        run: |
          cd zvec
          git fetch --tags --unshallow; if ($LASTEXITCODE -ne 0) { git fetch --tags }
          Write-Host "=== zvec describe ==="
          git describe --tags
        shell: pwsh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: go.mod

      # --- Unix build tools ---
      - name: Set up Python (for CMake/Ninja)
        if: runner.os != 'Windows' && matrix.container == '' && matrix.docker_build == ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install build tools (Unix)
        if: runner.os != 'Windows' && matrix.docker_build == ''
        run: |
          if [ -d /opt/python/cp310-cp310 ]; then
            export PATH="/opt/python/cp310-cp310/bin:$PATH"
            # Persist for later steps so the pip-installed cmake/ninja shadow
            # the image-bundled tools (musllinux images ship an unsupported
            # CMake 4.x) — same as upstream _build_prebuilt.yml.
            echo "/opt/python/cp310-cp310/bin" >> $GITHUB_PATH
          fi
          # Install system build tools for manylinux/EL-based containers
          if command -v yum &> /dev/null; then
            yum install -y ninja-build gcc gcc-c++ || true
          fi
          python -m pip install --upgrade pip cmake==3.30.0 ninja==1.11.1
          echo "$(python -c 'import site; print(site.USER_BASE)')/bin" >> $GITHUB_PATH
        shell: bash

      # --- Windows build tools ---
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch || 'x64' }}

      - name: Install CMake 3.30 and Ninja (Windows x64)
        if: runner.os == 'Windows' && matrix.msvc_arch != 'arm64'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.30.0'
          ninjaVersion: '1.11.1'

      # cmake/ninja publish native win_arm64 wheels, so ARM64 jobs install them
      # with pip — same approach as upstream _build_prebuilt.yml.
      - name: Install CMake 3.30 and Ninja (Windows ARM64)
        if: runner.os == 'Windows' && matrix.msvc_arch == 'arm64'
        run: |
          python -m pip install --upgrade pip cmake==3.30.0 ninja==1.11.1
        shell: pwsh

      # --- Build C-API library ---
      - name: Build C-API library (Unix)
        if: runner.os != 'Windows' && matrix.docker_build == ''
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.env.MACOSX_DEPLOYMENT_TARGET }}
        run: |
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          # Pin the macOS target architecture; empty elsewhere so CMake keeps
          # the host default.
          OSX_ARCH_ARGS=""
          if [ -n "${{ matrix.osx_arch }}" ]; then
            OSX_ARCH_ARGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}"
          fi
          cd zvec
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_C_BINDINGS=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET:-13.0} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            $OSX_ARCH_ARGS \
            -G Ninja
          cmake --build . -j$NPROC --target zvec_c_api
        shell: bash

      # --- musl arm64: build inside a musllinux container via docker exec ---
      # JavaScript actions cannot run inside Alpine containers on arm64, so
      # only the CMake build runs in the container; the workspace is mounted.
      # Prepends the image-bundled CPython so the pip-installed cmake/ninja
      # shadow the tools bundled in the image, which include an unsupported
      # CMake 4.x — same as upstream build-musl-arm64.
      - name: Start musllinux container (musl arm64)
        if: matrix.docker_build != ''
        run: |
          docker run -d --name zvec-musl-build \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e PATH="/opt/python/cp310-cp310/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "${{ matrix.docker_build }}" sleep infinity
          docker exec zvec-musl-build sh -c \
            'command -v bash || apk add --no-cache bash; command -v git || apk add --no-cache git'
        shell: bash

      - name: Install build tools (musl arm64 container)
        if: matrix.docker_build != ''
        run: |
          docker exec zvec-musl-build python -m pip install --upgrade pip
          docker exec zvec-musl-build python -m pip install \
            cmake==3.30.0 \
            ninja==1.11.1
        shell: bash

      - name: Build C-API library (musl arm64 container)
        if: matrix.docker_build != ''
        run: |
          docker exec zvec-musl-build cmake -S zvec -B zvec/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_C_BINDINGS=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          docker exec zvec-musl-build sh -c \
            'cmake --build zvec/build -j"$(nproc)" --target zvec_c_api'
        shell: bash

      - name: Tear down musllinux container (musl arm64)
        if: always() && matrix.docker_build != ''
        run: docker rm -f zvec-musl-build || true
        shell: bash

      - name: Build C-API library (Windows)
        if: runner.os == 'Windows'
        run: |
          cd zvec
          mkdir build -ErrorAction SilentlyContinue
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_C_BINDINGS=ON ${{ matrix.win_cmake_args }}
          cmake --build . --config Release --target zvec_c_api -j $env:NUMBER_OF_PROCESSORS
        shell: pwsh

      # Guard against publishing a library built for the wrong architecture
      # (e.g. an arm64 slice on an Intel runner) — same check as upstream
      # _build_macos_x64_sdk.yml.
      - name: Verify library architecture (macOS)
        if: runner.os == 'macOS'
        run: |
          LIB="zvec/build/lib/${{ matrix.lib_name }}"
          archs=$(lipo -archs "$LIB")
          echo "$LIB: $archs"
          want=$(uname -m)
          if ! printf '%s\n' "$archs" | tr ' ' '\n' | grep -Fx "$want" > /dev/null; then
            echo "::error::$LIB is missing the $want slice (got: $archs)"
            exit 1
          fi
        shell: bash

      # --- Package libraries ---
      - name: Package libraries (Unix)
        if: runner.os != 'Windows'
        run: |
          PLATFORM="${{ matrix.platform }}"
          mkdir -p staging/$PLATFORM staging/include/zvec

          # Copy shared library
          cp zvec/build/lib/${{ matrix.lib_name }} staging/$PLATFORM/
          echo "✓ Copied ${{ matrix.lib_name }}"

          # Copy header
          cp zvec/src/include/zvec/c_api.h staging/include/zvec/
          echo "✓ Copied c_api.h"

          # Show results
          ls -la staging/$PLATFORM/
          du -h staging/$PLATFORM/${{ matrix.lib_name }}
        shell: bash

      - name: Package libraries (Windows)
        if: runner.os == 'Windows'
        run: |
          $platform = "${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "staging/$platform"
          New-Item -ItemType Directory -Force -Path "staging/include/zvec"

          # Find and copy DLL
          # Covers both Multi-Config (Visual Studio: bin/Release/, lib/Release/)
          # and Single-Config (Ninja: bin/, lib/) generators.
          $dllPaths = @(
            "zvec/build/bin/Release/zvec_c_api.dll",
            "zvec/build/bin/zvec_c_api.dll",
            "zvec/build/lib/Release/zvec_c_api.dll",
            "zvec/build/lib/zvec_c_api.dll"
          )
          $dllFound = $false
          foreach ($path in $dllPaths) {
            if (Test-Path $path) {
              Copy-Item $path "staging/$platform/"
              Write-Host "✓ Copied DLL from $path"
              $dllFound = $true
              break
            }
          }
          if (-not $dllFound) {
            Write-Host "=== All .dll files under zvec/build/ ==="
            Get-ChildItem -Recurse zvec/build/ -Filter "*.dll" -ErrorAction SilentlyContinue
            Write-Error "DLL not found in any expected location"
            exit 1
          }

          # Find and copy import library (.lib)
          $libPaths = @(
            "zvec/build/lib/Release/zvec_c_api.lib",
            "zvec/build/lib/zvec_c_api.lib",
            "zvec/build/bin/Release/zvec_c_api.lib",
            "zvec/build/bin/zvec_c_api.lib"
          )
          foreach ($path in $libPaths) {
            if (Test-Path $path) {
              Copy-Item $path "staging/$platform/"
              Write-Host "✓ Copied import library from $path"
              break
            }
          }

          # Copy header
          Copy-Item "zvec/src/include/zvec/c_api.h" "staging/include/zvec/"
          Write-Host "✓ Copied c_api.h"

          # Show results
          Get-ChildItem "staging/$platform/"
        shell: pwsh

      # --- Verify Go build with vendor libs ---
      - name: Verify Go build with vendor libs (Unix)
        if: runner.os != 'Windows'
        run: |
          # Copy staged libs to lib/ for Go build verification
          PLATFORM="${{ matrix.platform }}"
          mkdir -p lib/$PLATFORM lib/include/zvec
          cp staging/$PLATFORM/* lib/$PLATFORM/
          cp staging/include/zvec/c_api.h lib/include/zvec/

          # Verify Go build compiles (vendor mode, no source tag)
          # Use "go build ." instead of "./..." to avoid scanning zvec submodule
          CGO_ENABLED=1 go build .
          echo "✓ Go build succeeded with vendor libraries"
        shell: bash

      - name: Verify Go build with vendor libs (Windows)
        if: runner.os == 'Windows'
        run: |
          $platform = "${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "lib/$platform"
          New-Item -ItemType Directory -Force -Path "lib/include/zvec"
          Copy-Item "staging/$platform/*" "lib/$platform/"
          Copy-Item "staging/include/zvec/c_api.h" "lib/include/zvec/"

          # Add DLL to PATH for runtime
          $libPath = "${{ github.workspace }}\lib\$platform"
          $env:PATH = "$libPath;$env:PATH"

          # Verify Go build compiles (vendor mode, no source tag)
          # Use "go build ." instead of "./..." to avoid scanning zvec submodule
          $env:CGO_ENABLED = "1"
          go build .
          Write-Host "✓ Go build succeeded with vendor libraries"
        shell: pwsh

      # --- Create archive ---
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd staging
          tar -czf ../${{ matrix.artifact_name }}.tar.gz .
          cd ..
          if command -v sha256sum &> /dev/null; then
            sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          fi
          echo "=== Archive ==="
          ls -la ${{ matrix.artifact_name }}.tar.gz
          cat ${{ matrix.artifact_name }}.tar.gz.sha256
        shell: bash

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd staging
          Compress-Archive -Path * -DestinationPath ..\${{ matrix.artifact_name }}.zip
          cd ..
          $hash = (Get-FileHash "${{ matrix.artifact_name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact_name }}.zip.sha256"
          Write-Host "=== Archive ==="
          Get-ChildItem "${{ matrix.artifact_name }}.zip"
          Get-Content "${{ matrix.artifact_name }}.zip.sha256"
        shell: pwsh

      # --- Upload artifact ---
      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.zip.sha256

  # ===========================================================================
  # Create GitHub Release with all platform libraries
  # ===========================================================================
  release:
    name: Create Release
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find ./artifacts -type f | sort
        shell: bash

      - name: Generate release notes
        id: notes
        run: |
          cat > release-notes.md << 'NOTES_EOF'
          ## zvec-go ${{ steps.tag.outputs.tag }}

          ### Pre-built Libraries

          Download the archive for your platform and extract it to the `lib/` directory:

          | Platform | Archive | Architecture |
          |----------|---------|--------------|
          | **macOS** | `zvec-libs-darwin-x64.tar.gz` | Intel (x86_64, macOS 11+) |
          | **macOS** | `zvec-libs-darwin-arm64.tar.gz` | Apple Silicon (M1/M2/M3/M4) |
          | **Linux (glibc 2.28+)** | `zvec-libs-linux-x64.tar.gz` | x86_64 |
          | **Linux (glibc 2.28+)** | `zvec-libs-linux-arm64.tar.gz` | ARM64 (aarch64) |
          | **Linux (musl, Alpine)** | `zvec-libs-linux-musl-x64.tar.gz` | x86_64 |
          | **Linux (musl, Alpine)** | `zvec-libs-linux-musl-arm64.tar.gz` | ARM64 (aarch64) |
          | **Windows** | `zvec-libs-windows-x64.zip` | x86_64 |
          | **Windows** | `zvec-libs-windows-arm64.zip` | ARM64 |

          Since zvec v0.8.0 the `jieba` FTS tokenizer ships its dictionaries
          inside the C-API library, so the archives no longer carry extra
          data files.

          ### Quick Start

          ```bash
          # 1. clone zvec-go source code
          git clone --recursive https://github.com/zvec-ai/zvec-go.git
          cd zvec-go

          # 2. Download corresponding platform pre-built library.
          #    If linking fails due to GLIBC incompatibility, build from source instead:
          #    make build-zvec
          go run ./cmd/download-libs -version v0.6.0

          # 3. Back to your project, replace with local source code
          cd /path/to/project
          go mod edit -replace github.com/zvec-ai/zvec-go=/path/to/zvec-go
          go mod tidy

          # 4. Build (you can now build your project)
          CGO_ENABLED=1 go build .
          ```

          ### Checksums

          SHA-256 checksums are provided in `.sha256` files alongside each archive.
          NOTES_EOF
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-rc') || contains(steps.tag.outputs.tag, '-beta') || contains(steps.tag.outputs.tag, '-alpha') }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
            artifacts/**/*.zip
            artifacts/**/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
